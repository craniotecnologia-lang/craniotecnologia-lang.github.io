<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Autorizar Evidências</title>
<style>body{font:16px system-ui;background:#101519;color:#e8eff0;max-width:560px;margin:12vh auto;padding:24px}h1{font-size:25px}a,button{color:#b5ecd8}a{display:inline-block;padding:12px 0}p{line-height:1.6}</style></head><body><h1>Autorização do Evidências</h1><p id="status">Retornando ao painel do Ubuntu…</p><a id="back" hidden>Voltar ao painel</a>
<script>
'use strict';
(async()=>{
 const parameters=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);
 const state=parameters.get('state')||'',code=parameters.get('code')||'',error=parameters.get('error')||'';
 const status=document.getElementById('status'),back=document.getElementById('back');
 try{
  if(!state||state.length>2048||code.length>4096)throw Error();
  const bytes=Uint8Array.from(atob(state.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
  const info=JSON.parse(new TextDecoder().decode(bytes)),origin=new URL(info.o);
  if(origin.protocol!=='https:'||origin.username||origin.password||origin.origin!==info.o||typeof info.n!=='string'||info.n.length<32)throw Error();
  const response={type:'evidencias-oauth-browser',state,code,error:error.slice(0,100)};
  const encoded=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(response)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
  const destination=origin.origin+'/#drive-auth='+encoded;
  back.href=destination;back.hidden=false;
  let confirmed=false;
  window.addEventListener('message',event=>{
   if(event.origin!==origin.origin||event.source!==window.opener||event.data?.state!==state)return;
   if(event.data.type==='evidencias-oauth-received'){confirmed=true;status.textContent='Resposta recebida pelo Ubuntu. Aguarde a confirmação no painel…';}
   if(event.data.type==='evidencias-oauth-complete'){confirmed=true;status.textContent='Autorização concluída. Volte ao painel.';window.close();}
  });
  try{window.opener?.postMessage(response,origin.origin);}catch{}
  // Também funciona quando o navegador separa a janela do Google da janela original.
  setTimeout(()=>{if(!confirmed)location.replace(destination);},1800);
 }catch{status.textContent='Resposta inválida ou incompleta. Volte ao painel e clique em Renovar autorização novamente.';}
})();
</script></body></html>
